[project]
name = "ptv-mcp-server"
version = "0.1.0"
description = "An MCP server exposing Victoria's public transport (PTV) GTFS timetable data for natural-language querying by LLMs."
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.28,<2",
    "pandas>=2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ptv_mcp"]
